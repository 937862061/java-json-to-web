<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据展示工具 - Java类与JSON数据可视化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            min-height: 100vh;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .hero-bg {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            position: relative;
            overflow: hidden;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
        }
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
        .animate-fade-in {
            opacity: 0;
            transform: translateY(20px);
        }
        .animate-slide-in {
            opacity: 0;
            transform: translateX(-30px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3182ce 0%, #2c5282 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(49, 130, 206, 0.3);
        }
        .input-focus:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-success { background-color: #38a169; }
        .status-warning { background-color: #d69e2e; }
        .status-error { background-color: #e53e3e; }
        .data-table th {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 10;
            min-width: 120px;
            max-width: 200px;
            white-space: normal;
            word-wrap: break-word;
            word-break: break-word;
            line-height: 1.4;
            vertical-align: middle;
        }
        .data-table td {
            min-width: 120px;
            max-width: 200px;
            word-break: break-word;
            line-height: 1.4;
        }
        .highlight-match {
            background-color: #fef5e7;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="hero-bg text-white py-12 relative">
        <div class="container mx-auto px-6 relative z-10">
            <div class="text-center">
                <h1 class="text-4xl font-bold mb-4 animate-fade-in" id="main-title">
                    数据展示工具
                </h1>
                <p class="text-xl opacity-90 animate-fade-in" id="subtitle">
                    Java类与JSON数据可视化检查平台
                </p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <!-- Input Panel - Now on top -->
        <div class="glass-effect rounded-xl p-6 shadow-lg animate-slide-in mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
                <span class="status-indicator status-success"></span>
                数据输入区域
            </h2>
            
            <!-- Input Container -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Java Class Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Java类代码
                    </label>
                    <textarea 
                        id="javaInput" 
                        class="w-full h-40 p-4 border border-gray-300 rounded-lg input-focus code-font text-sm resize-none"
                        placeholder="请粘贴Java类代码，系统将自动提取字段注释..."
                    ></textarea>
                    <div class="mt-2 text-sm text-gray-500">
                        <span id="javaStatus">等待输入Java类代码</span>
                    </div>
                </div>

                <!-- JSON Data Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        JSON数据
                    </label>
                    <textarea 
                        id="jsonInput" 
                        class="w-full h-40 p-4 border border-gray-300 rounded-lg input-focus code-font text-sm resize-none"
                        placeholder="请粘贴JSON格式数据列表..."
                    ></textarea>
                    <div class="mt-2 text-sm text-gray-500">
                        <span id="jsonStatus">等待输入JSON数据</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 mt-6">
                <button 
                    id="parseBtn" 
                    class="btn-primary text-white px-6 py-3 rounded-lg font-medium flex-1"
                >
                    解析数据
                </button>
                <button 
                    id="exampleBtn" 
                    class="bg-gray-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-gray-700 transition-colors"
                >
                    示例数据
                </button>
                <button 
                    id="clearBtn" 
                    class="bg-red-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-red-700 transition-colors"
                >
                    清空
                </button>
            </div>

            <!-- Field Mapping -->
            <div id="fieldMapping" class="hidden mt-6">
                <h3 class="text-lg font-medium text-gray-800 mb-3">字段映射关系</h3>
                <div id="mappingList" class="space-y-2 max-h-40 overflow-y-auto">
                    <!-- 动态生成字段映射 -->
                </div>
            </div>
        </div>

        <!-- Output Panel - Now on bottom -->
        <div class="glass-effect rounded-xl p-6 shadow-lg animate-slide-in">
            <!-- Control Bar -->
            <div class="flex flex-wrap items-center justify-between mb-6">
                <h2 class="text-2xl font-semibold text-gray-800 flex items-center">
                    <span class="status-indicator status-warning"></span>
                    数据展示区域
                </h2>
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜索数据..." 
                        class="px-4 py-2 border border-gray-300 rounded-lg input-focus text-sm"
                    >
                    <button 
                        id="exportCSVBtn" 
                        class="bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700 transition-colors"
                    >
                        导出CSV
                    </button>
                    <button 
                        id="exportExcelBtn" 
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors"
                    >
                        导出Excel
                    </button>
                </div>
            </div>

            <!-- Statistics -->
            <div id="statistics" class="hidden mb-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-blue-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-blue-600" id="totalRecords">0</div>
                        <div class="text-sm text-blue-800">总记录数</div>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-green-600" id="totalFields">0</div>
                        <div class="text-sm text-green-800">字段数量</div>
                    </div>
                    <div class="bg-yellow-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-yellow-600" id="emptyValues">0</div>
                        <div class="text-sm text-yellow-800">空值数量</div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-purple-600" id="uniqueValues">0</div>
                        <div class="text-sm text-purple-800">唯一值</div>
                    </div>
                </div>
            </div>

            <!-- Table Container -->
            <div id="tableContainer" class="hidden">
                <div class="table-container border border-gray-200 rounded-lg">
                    <table id="dataTable" class="data-table w-full text-sm">
                        <thead>
                            <!-- 动态生成表头 -->
                        </thead>
                        <tbody>
                            <!-- 动态生成表格内容 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div id="pagination" class="hidden flex items-center justify-between mt-4">
                    <div class="text-sm text-gray-600">
                        显示 <span id="pageStart">1</span>-<span id="pageEnd">10</span> 条，共 <span id="totalCount">0</span> 条记录
                    </div>
                    <div class="flex gap-2">
                        <button id="prevPage" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
                            上一页
                        </button>
                        <span id="currentPage" class="px-3 py-1 bg-blue-600 text-white rounded">1</span>
                        <button id="nextPage" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">
                            下一页
                        </button>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12">
                <div class="text-gray-400 mb-4">
                    <svg class="w-16 h-16 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                    </svg>
                </div>
                <h3 class="text-lg font-medium text-gray-600 mb-2">暂无数据</h3>
                <p class="text-gray-500">请在上方输入Java类代码和JSON数据，然后点击"解析数据"按钮</p>
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden text-center py-12">
                <div class="text-red-400 mb-4">
                    <svg class="w-16 h-16 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <h3 class="text-lg font-medium text-red-600 mb-2">解析错误</h3>
                <p id="errorMessage" class="text-red-500">请检查输入的数据格式是否正确</p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-600">正在解析数据...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-gray-400">© 2024 数据展示工具 - 专业的Java类与JSON数据可视化平台</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
